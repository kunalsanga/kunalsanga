    </g>

    <g transform="translate(35, 143)">
      <circle cx="5" cy="5" r="5" fill="#3572A5"/>
      <text x="18" y="9" class="lang-name">Python</text>
      <text x="200" y="9" class="lang-pct" text-anchor="end">13.52% <tspan class="lang-bytes">(35.4 MB)</tspan></text>
    </g>

    <g transform="translate(255, 143)">
      <circle cx="5" cy="5" r="5" fill="#3178c6"/>
      <text x="18" y="9" class="lang-name">TypeScript</text>
      <text x="200" y="9" class="lang-pct" text-anchor="end">9.51% <tspan class="lang-bytes">(24.9 MB)</tspan></text>
    </g>

    <g transform="translate(35, 171)">
