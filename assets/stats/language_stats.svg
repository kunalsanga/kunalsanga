    <g transform="translate(255, 171)">
      <circle cx="5" cy="5" r="5" fill="#f34b7d"/>
      <text x="18" y="9" class="lang-name">C++</text>
      <text x="200" y="9" class="lang-pct" text-anchor="end">0.78% <tspan class="lang-bytes">(2.0 MB)</tspan></text>
    </g>

  <line x1="25" y1="188" x2="455" y2="188" class="divider"/>

  <!-- Footer -->
  <text x="25" y="208" class="footer">✓ Calculated from public source repositories</text>
  <text x="455" y="208" class="footer" text-anchor="end">Refreshed: 2026-10-11 UTC</text>
