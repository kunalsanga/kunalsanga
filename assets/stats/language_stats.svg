      <text x="200" y="9" class="lang-pct" text-anchor="end">53.09% <tspan class="lang-bytes">(139.0 MB)</tspan></text>
    </g>

    <g transform="translate(255, 115)">
      <circle cx="5" cy="5" r="5" fill="#e34c26"/>
      <text x="18" y="9" class="lang-name">HTML</text>
