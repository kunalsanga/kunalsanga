name: Update Dynamic Profile Stats

on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: profile-stats-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-profile-stats:
    name: Generate Verified Stats & SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: false

      - name: Run Unit Tests
        run: |
          python tests/test_stats.py

      - name: Collect GitHub Metrics & Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: kunalsanga
        run: |
          python scripts/generate_stats.py

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/
          if git diff --staged --quiet; then
            echo "No stats changes detected."
          else
            git commit -m "chore(stats): update dynamic profile metrics and SVGs [skip ci]"
            git push origin main
          fi